<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نظام تسجيل الحضور</title>

<link rel="stylesheet" href="style.css">

<script src="employees.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<div class="container">

<h2>نظام تسجيل الحضور</h2>

<input id="nationalId" placeholder="ادخل رقم الجوال">
<button onclick="checkAndRegister()">تسجيل الحضور</button>

<p id="status">تنويه.. لا يمكن تسجيل الحضور إلا عند التواجد داخل نطاق موقع العمل الفعلي</p>

</div>

<script>

/* =========================
   Firebase
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyDQIbSRsDjF0tcSTpICDsZJc0tHAqV4Ln0",
  authDomain: "haij-79fdd.firebaseapp.com",
  databaseURL: "https://haij-79fdd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "haij-79fdd",
  storageBucket: "haij-79fdd.firebasestorage.app",
  messagingSenderId: "165660477425",
  appId: "1:165660477425:web:08d138f9317a84f1cb2650"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* =========================
   الموقع الثابت
========================= */
const allowedLat = 21.3428934;
const allowedLng = 39.9615361;
const radiusMeters = 400;

/* =========================
   حساب المسافة
========================= */
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(Δφ/2) ** 2 +
    Math.cos(φ1) * Math.cos(φ2) *
    Math.sin(Δλ/2) ** 2;

  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* =========================
   التحقق
========================= */
function checkAndRegister() {

  const status = document.getElementById("status");
  const id = document.getElementById("nationalId").value;

  if (!id) {
    status.innerText = "❌ ادخل رقم الهوية";
    return;
  }

  const employee = employees.find(e => e.id === id);

  if (!employee) {
    status.innerText = "❌ الموظف غير مسجل";
    return;
  }

  requestLocation(employee);
}

/* =========================
   GPS
========================= */
function requestLocation(employee) {

  const status = document.getElementById("status");

  status.innerText = "📍 جاري تحديد الموقع...";

  navigator.geolocation.getCurrentPosition(

    (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      saveAttendance(employee, lat, lng);

    },

    (err) => {
      status.innerText = "❌ GPS خطأ: " + err.message;
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

/* =========================
   حفظ الحضور
========================= */
function saveAttendance(employee, lat, lng) {

  const status = document.getElementById("status");

  const distance = getDistance(lat, lng, allowedLat, allowedLng);

  if (distance > radiusMeters) {
    status.innerText = "❌ غير مسموح: خارج الموقع";
    return;
  }

  const now = new Date();

  const saTime = new Date(
    now.toLocaleString("en-US", { timeZone: "Asia/Riyadh" })
  );

  const date =
    saTime.getFullYear() + "-" +
    String(saTime.getMonth()+1).padStart(2,'0') + "-" +
    String(saTime.getDate()).padStart(2,'0');

  const time =
    String(saTime.getHours()).padStart(2,'0') + ":" +
    String(saTime.getMinutes()).padStart(2,'0');

  db.ref("attendance/" + date + "/" + employee.id)
    .set({
      id: employee.id,
      name: employee.name,
      time: time,
      location: employee.locationName || "غير معروف"
    })
    .then(() => {
      status.innerText = "✅ تم تسجيل الحضور بنجاح";
    })
    .catch((err) => {
      status.innerText = "❌ خطأ: " + err.message;
    });
}

</script>

</body>
</html>
