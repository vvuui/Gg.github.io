<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نظام تسجيل الحضور</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="employees.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body {
  font-family: Arial;
  direction: rtl;
  background:#f4f6f9;
  margin:0;
  padding:20px;
}

.container {
  background:#fff;
  padding:25px;
  border-radius:12px;
  max-width:420px;
  margin:auto;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  text-align:center;
}

h2 {
  font-size:18px;
  margin-bottom:20px;
}

input {
  width:90%;
  padding:12px;
  font-size:16px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:8px;
}

button {
  width:100%;
  padding:12px;
  font-size:16px;
  background:#4CAF50;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.status {
  margin-top:10.5px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>نظام تسجيل الحضور</h2>

<input id="phone" placeholder="رقم الجوال">

<input id="secret" placeholder="الكود السري" style="display:none;">

<button onclick="nextStep()">متابعة</button>

<p id="status"> تنويه.. لا يمكن تسجيل الحضور إلا عند التواجد داخل نطاق موقع العمل الفعلي </p>

</div>

<script>

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyDQIbSRsDjF0tcSTpICDsZJc0tHAqV4Ln0",
  authDomain: "haij-79fdd.firebaseapp.com",
  databaseURL: "https://haij-79fdd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "haij-79fdd",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* الموقع */
const allowedLat = 21.342893;
const allowedLng = 39.961536;
const radiusMeters = 400;

/* الموظف الحالي */
let currentEmployee = null;

/* حساب المسافة */
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(Δφ/2) ** 2 +
    Math.cos(φ1) * Math.cos(φ2) *
    Math.sin(Δλ/2) ** 2;

  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ================= STEP ================= */
function nextStep() {

  const status = document.getElementById("status");
  const phone = document.getElementById("phone").value;
  const secretInput = document.getElementById("secret");

  if (!currentEmployee) {

    const emp = employees.find(e => e.id === phone);

    if (!emp) {
      status.innerText = "رقم الجوال الموظف غير مسجل ❌";
      return;
    }

    currentEmployee = emp;

    secretInput.style.display = "block";
    status.innerText = "أدخل الكود السري 🔐";

    return;
  }

  const code = document.getElementById("secret").value;

  if (code !== currentEmployee.secretCode) {
    status.innerText = "كود سري غير صحيح ❌";
    return;
  }

  status.innerText = "📍 جاري تحديد الموقع...";
  getLocation();
}

/* GPS */
function getLocation() {

  navigator.geolocation.getCurrentPosition(

    (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      saveAttendance(lat, lng);
    },

    () => {
      document.getElementById("status").innerText = "فشل تحديد الموقع ❌";
    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
}

/* ================= حفظ (تم الإصلاح هنا) ================= */
function saveAttendance(lat, lng) {

  const status = document.getElementById("status");

  const distance = getDistance(lat, lng, allowedLat, allowedLng);

  if (distance > radiusMeters) {
    status.innerText = "غير مسموح خارج الموقع ❌";
    return;
  }

  const now = new Date();

  const date =
    now.getFullYear() + "-" +
    String(now.getMonth()+1).padStart(2,'0') + "-" +
    String(now.getDate()).padStart(2,'0');

  const time =
    String(now.getHours()).padStart(2,'0') + ":" +
    String(now.getMinutes()).padStart(2,'0');

  db.ref("attendance/" + date + "/" + currentEmployee.id)
    .set({
      id: currentEmployee.id,
      name: currentEmployee.name,
      time: time,
      lat: lat,
      lng: lng,

      /* ✅ هذا السطر المهم */
      location: currentEmployee.locationName
    })

    .then(() => {
      status.innerText = "✅ تم تسجيل الحضور بنجاح";
    })

    .catch(() => {
      status.innerText = "❌ خطأ في الحفظ";
    });
}

</script>

</body>
</html>
